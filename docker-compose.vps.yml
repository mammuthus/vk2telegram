services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      - "${METRICS_BIND_ADDRESS:-127.0.0.1}:9102:9102"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - relay_network
    logging:
      options:
        max-size: "10M"
        max-file: "10"

  db:
    image: postgres:9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tgvkbot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - relay_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  relay_network:

volumes:
  postgres_data: